<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Music Lab - Timeline & Instruments</title>
    <style>
        :root {
            --bg-dark: #121214;
            --bg-panel: #1a1a1e;
            --bg-card: #24242c;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2e2e38;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        header {
            height: 45px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        header h1 {
            font-size: 1rem;
            font-weight: 600;
        }

        /* Workspace Layout */
        .workspace-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Left Sidebar: Projects */
        sidebar {
            width: 240px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
            width: 100%;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .project-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .project-item {
            padding: 10px;
            background-color: var(--bg-card);
            border-radius: 6px;
            margin-bottom: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .project-item:hover, .project-item.active {
            border-color: var(--accent);
        }

        /* Center Content Area */
        .center-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
            overflow: hidden;
        }

        /* Top Section: Big Timeline */
        .timeline-section {
            flex: 1;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            padding: 15px;
            border-bottom: 1px solid var(--border);
            min-height: 250px;
        }

        .timeline-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .timeline-toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .control-btn:hover {
            border-color: var(--accent);
        }

        .timeline-grid {
            flex: 1;
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            position: relative;
            overflow: auto;
            display: flex;
            flex-direction: column;
        }

        .timeline-track-row {
            height: 50px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 10px;
            position: relative;
        }

        .timeline-track-label {
            width: 120px;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            border-right: 1px solid var(--border);
            padding-right: 10px;
        }

        .timeline-track-content {
            flex: 1;
            height: 100%;
            position: relative;
        }

        /* Bottom Section: Collapsible Instrument Drawer */
        .instrument-drawer {
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: height 0.3s ease;
            height: 220px;
        }

        .drawer-header {
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            background-color: rgba(255,255,255,0.02);
        }

        .drawer-content {
            padding: 15px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .instrument-search {
            width: 100%;
            padding: 8px 12px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
        }

        .instrument-search:focus {
            outline: none;
            border-color: var(--accent);
        }

        .instrument-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }

        .instrument-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            cursor: grab;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.2s;
        }

        .instrument-card:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .note-chips {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .note-chip {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            color: var(--text-main);
        }

        .note-chip:hover {
            background-color: var(--accent);
            border-color: var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <h1>🎵 Open Music Lab</h1>
        <span id="current-project-label" style="color: var(--text-muted); font-size: 0.85rem;">Project: Untitled</span>
    </header>

    <div class="workspace-container">
        <!-- Sidebar: Projects -->
        <sidebar>
            <div class="section-title">Projects</div>
            <button class="btn" onclick="createNewProject()">+ New Project</button>
            <ul id="project-list" class="project-list"></ul>
        </sidebar>

        <!-- Center Workspace -->
        <div class="center-workspace">
            <!-- Top: Big Timeline -->
            <div class="timeline-section">
                <div class="timeline-header">
                    <div class="section-title" style="margin: 0;">Composition Timeline</div>
                    <div class="timeline-toolbar">
                        <button class="control-btn" onclick="togglePlay()">▶ Play Preview</button>
                        <span id="time-display" style="font-size: 0.85rem; color: var(--text-muted);">00:00</span>
                    </div>
                </div>
                <div class="timeline-grid" id="timeline-grid" ondragover="allowDrop(event)" ondrop="dropOnTimeline(event)">
                    <!-- Tracks dynamically generated here -->
                </div>
            </div>

            <!-- Bottom: Collapsible Instrument Drawer -->
            <div class="instrument-drawer" id="instrument-drawer">
                <div class="drawer-header" onclick="toggleDrawer()">
                    <span class="section-title" style="margin: 0;">Instrument Drawer (Click to Collapse/Expand)</span>
                    <span id="drawer-toggle-icon" style="font-size: 0.8rem; color: var(--text-muted);">▼</span>
                </div>
                <div class="drawer-content" id="drawer-content">
                    <input type="text" class="instrument-search" placeholder="Search instruments (e.g., Piano, Jingle Bell, Stick Tap)..." oninput="filterInstruments(this.value)">
                    <div class="instrument-grid" id="instrument-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Web Audio API Context Setup for sound generation & previews
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playNoteSound(instrumentName, noteName) {
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            // Map notes to frequencies or create percussion bursts
            let freq = 440;
            if (noteName === 'C4') freq = 261.63;
            if (noteName === 'E4') freq = 329.63;
            if (noteName === 'G4') freq = 392.00;
            if (noteName === 'C5') freq = 523.25;

            if (instrumentName.includes('Jingle')) {
                osc.type = 'triangle';
                freq = 1200; // High metallic jingle
            } else if (instrumentName.includes('Stick')) {
                osc.type = 'square';
                freq = 180; // Short wood click simulation
            } else {
                osc.type = 'sine';
            }

            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            // Envelope (fade out quickly so it sounds clean)
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        // State Management
        let projects = JSON.parse(localStorage.getItem('music_lab_projects')) || [
            { id: 1, name: 'My First Beat', tracks: [] }
        ];
        let currentProjectId = projects[0].id;
        let drawerOpen = true;

        const instruments = [
            { name: 'Acoustic Grand Piano', category: 'Keys', notes: ['C4', 'E4', 'G4', 'C5'] },
            { name: 'Jingle Bell', category: 'Percussion', notes: ['High', 'Low'] },
            { name: 'Stick Tap / Woodblock', category: 'Percussion', notes: ['Tap'] },
            { name: 'Acoustic Guitar', category: 'Strings', notes: ['C4', 'E4', 'G4'] },
            { name: 'Flute', category: 'Woodwind', notes: ['C4', 'G4', 'C5'] },
            { name: 'Synth Lead', category: 'Electronic', notes: ['C4', 'E4', 'G4', 'C5'] }
        ];

        function init() {
            renderProjects();
            renderInstruments(instruments);
            renderTimeline();
        }

        function renderProjects() {
            const list = document.getElementById('project-list');
            list.innerHTML = '';
            projects.forEach(p => {
                const li = document.createElement('li');
                li.className = `project-item ${p.id === currentProjectId ? 'active' : ''}`;
                li.innerHTML = `<strong>${p.name}</strong>`;
                li.onclick = () => switchProject(p.id);
                list.appendChild(li);
            });
            const activeProj = projects.find(p => p.id === currentProjectId);
            document.getElementById('current-project-label').innerText = `Project: ${activeProj ? activeProj.name : 'Untitled'}`;
        }

        function createNewProject() {
            const name = prompt("Enter project name:", `Project ${projects.length + 1}`);
            if (!name) return;
            const newProj = { id: Date.now(), name: name, tracks: [] };
            projects.push(newProj);
            saveAndRefresh();
            switchProject(newProj.id);
        }

        function switchProject(id) {
            currentProjectId = id;
            renderProjects();
            renderTimeline();
        }

        function saveAndRefresh() {
            localStorage.setItem('music_lab_projects', JSON.stringify(projects));
            renderProjects();
        }

        function renderInstruments(items) {
            const grid = document.getElementById('instrument-grid');
            grid.innerHTML = '';
            items.forEach(inst => {
                const card = document.createElement('div');
                card.className = 'instrument-card';
                card.draggable = true;
                card.ondragstart = (e) => {
                    e.dataTransfer.setData('text/plain', JSON.stringify(inst));
                };

                let chipsHtml = inst.notes.map(n => `<span class="note-chip" onclick="event.stopPropagation(); playNoteSound('${inst.name}', '${n}')">${n}</span>`).join('');
                
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong style="font-size:0.85rem;">${inst.name}</strong>
                        <span style="font-size:0.7rem; color:var(--text-muted);">${inst.category}</span>
                    </div>
                    <div class="note-chips">${chipsHtml}</div>
                `;
                grid.appendChild(card);
            });
        }

        function filterInstruments(query) {
            const filtered = instruments.filter(i => i.name.toLowerCase().includes(query.toLowerCase()) || i.category.toLowerCase().includes(query.toLowerCase()));
            renderInstruments(filtered);
        }

        function toggleDrawer() {
            drawerOpen = !drawerOpen;
            const drawer = document.getElementById('instrument-drawer');
            const icon = document.getElementById('drawer-toggle-icon');
            if (drawerOpen) {
                drawer.style.height = '220px';
                icon.innerText = '▼';
            } else {
                drawer.style.height = '40px';
                icon.innerText = '▲';
            }
        }

        function renderTimeline() {
            const grid = document.getElementById('timeline-grid');
            const activeProj = projects.find(p => p.id === currentProjectId);
            grid.innerHTML = '';

            if (!activeProj || activeProj.tracks.length === 0) {
                grid.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">Drag instruments from the bottom drawer here to start layering your composition!</div>`;
                return;
            }

            activeProj.tracks.forEach((track, index) => {
                const row = document.createElement('div');
                row.className = 'timeline-track-row';
                row.innerHTML = `
                    <div class="timeline-track-label">${track.instrument}</div>
                    <div class="timeline-track-content">
                        <span style="font-size: 0.8rem; color: var(--accent); padding-left: 10px;">Note Added: ${track.note}</span>
                    </div>
                `;
                grid.appendChild(row);
            });
        }

        function allowDrop(e) {
            e.preventDefault();
        }

        function dropOnTimeline(e) {
            e.preventDefault();
            const data = e.dataTransfer.getData('text/plain');
            if (!data) return;
            const inst = JSON.parse(data);
            
            // For now, add a default note when dropped onto the timeline
            const noteToAdd = inst.notes[0];
            playNoteSound(inst.name, noteToAdd);

            const activeProj = projects.find(p => p.id === currentProjectId);
            if (activeProj) {
                activeProj.tracks.push({ instrument: inst.name, note: noteToAdd });
                saveAndRefresh();
                renderTimeline();
            }
        }

        function togglePlay() {
            initAudio();
            alert("Playing full project preview sequence!");
        }

        init();
    </script>
</body>
</html>
