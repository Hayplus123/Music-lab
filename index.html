<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Music Lab</title>
    <style>
        :root {
            --bg-dark: #121214;
            --bg-panel: #1a1a1e;
            --bg-card: #24242c;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2e2e38;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        header {
            height: 50px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Main Workspace Layout */
        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Side Panel: Projects & Recordings */
        sidebar {
            width: 260px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
            width: 100%;
            margin-bottom: 15px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .project-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .project-item {
            padding: 10px;
            background-color: var(--bg-card);
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .project-item:hover, .project-item.active {
            border-color: var(--accent);
        }

        /* Center Main Area: Instruments & Notes */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
            padding: 20px;
            overflow-y: auto;
        }

        .instrument-search {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .instrument-search:focus {
            outline: none;
            border-color: var(--accent);
        }

        .instrument-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .instrument-card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .instrument-card:hover {
            background-color: var(--bg-card);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        /* Bottom Panel: Timeline & Scrubber */
        .timeline-container {
            height: 180px;
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .timeline-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .scrubber-track {
            flex: 1;
            margin: 0 15px;
            height: 6px;
            background-color: var(--bg-card);
            border-radius: 3px;
            position: relative;
            cursor: pointer;
        }

        .scrubber-handle {
            width: 14px;
            height: 14px;
            background-color: var(--accent);
            border-radius: 50%;
            position: absolute;
            top: -4px;
            left: 0;
            cursor: grab;
        }

        .tracks-area {
            flex: 1;
            background-color: var(--bg-dark);
            border-radius: 6px;
            border: 1px solid var(--border);
            position: relative;
            overflow-x: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎵 Open Music Lab</h1>
        <span id="current-project-label" style="color: var(--text-muted); font-size: 0.9rem;">Current Project: Untitled</span>
    </header>

    <div class="workspace">
        <!-- Sidebar: Projects -->
        <sidebar>
            <div class="section-title">Projects</div>
            <button class="btn" onclick="createNewProject()">+ New Project</button>
            <ul id="project-list" class="project-list">
                <!-- Dynamically injected projects -->
            </ul>
        </sidebar>

        <!-- Main Workspace -->
        <div class="main-content">
            <input type="text" class="instrument-search" placeholder="Search instruments (e.g., Piano, Jingle Bell, Woodblock)..." oninput="filterInstruments(this.value)">
            
            <div class="section-title">Available Instruments</div>
            <div class="instrument-grid" id="instrument-grid">
                <!-- Dynamically populated sample instruments -->
            </div>
        </div>
    </div>

    <!-- Bottom Timeline & Scrubber -->
    <div class="timeline-container">
        <div class="timeline-controls">
            <span style="font-size: 0.85rem; color: var(--text-muted);">Timeline / Playback</span>
            <div class="scrubber-track" id="scrubber-track">
                <div class="scrubber-handle" id="scrubber-handle"></div>
            </div>
            <span style="font-size: 0.85rem; color: var(--text-muted);">00:00 / 01:00</span>
        </div>
        <div class="tracks-area" id="tracks-area">
            <!-- Collapsible instrument note tracks will go here -->
        </div>
    </div>

    <script>
        // Sample state management
        let projects = JSON.parse(localStorage.getItem('music_lab_projects')) || [
            { id: 1, name: 'My First Beat', notes: [] }
        ];
        let currentProjectId = projects[0].id;

        const instruments = [
            { name: 'Acoustic Grand Piano', category: 'Keys' },
            { name: 'Jingle Bell', category: 'Percussion' },
            { name: 'Woodblock / Stick Tap', category: 'Percussion' },
            { name: 'Acoustic Guitar', category: 'Strings' },
            { name: 'Flute', category: 'Woodwind' },
            { name: 'Synth Lead', category: 'Electronic' }
        ];

        function init() {
            renderProjects();
            renderInstruments(instruments);
        }

        function renderProjects() {
            const list = document.getElementById('project-list');
            list.innerHTML = '';
            projects.forEach(p => {
                const li = document.createElement('li');
                li.className = `project-item ${p.id === currentProjectId ? 'active' : ''}`;
                li.innerHTML = `<strong>${p.name}</strong>`;
                li.onclick = () => switchProject(p.id);
                list.appendChild(li);
            });
            const activeProj = projects.find(p => p.id === currentProjectId);
            document.getElementById('current-project-label').innerText = `Current Project: ${activeProj ? activeProj.name : 'Untitled'}`;
        }

        function createNewProject() {
            const name = prompt("Enter project name:", `Project ${projects.length + 1}`);
            if (!name) return;
            const newProj = { id: Date.now(), name: name, notes: [] };
            projects.push(newProj);
            saveAndRefresh();
            switchProject(newProj.id);
        }

        function switchProject(id) {
            currentProjectId = id;
            renderProjects();
        }

        function saveAndRefresh() {
            localStorage.setItem('music_lab_projects', JSON.stringify(projects));
            renderProjects();
        }

        function renderInstruments(items) {
            const grid = document.getElementById('instrument-grid');
            grid.innerHTML = '';
            items.forEach(inst => {
                const card = document.createElement('div');
                card.className = 'instrument-card';
                card.innerHTML = `<strong>${inst.name}</strong><br><small style="color:var(--text-muted);">${inst.category}</small>`;
                card.onclick = () => alert(`Selected ${inst.name}! Next step will load its notes panel.`);
                grid.appendChild(card);
            });
        }

        function filterInstruments(query) {
            const filtered = instruments.filter(i => i.name.toLowerCase().includes(query.toLowerCase()));
            renderInstruments(filtered);
        }

        init();
    </script>
</body>
</html>
