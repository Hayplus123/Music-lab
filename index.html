<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Music Lab - Adjustable Note Lengths</title>
    <style>
        :root {
            --bg-dark: #121214;
            --bg-panel: #1a1a1e;
            --bg-card: #24242c;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2e2e38;
            --active-note: #10b981;
            --active-note-long: #059669;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        header {
            height: 45px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        header h1 {
            font-size: 1rem;
            font-weight: 600;
        }

        /* Workspace Layout */
        .workspace-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Left Sidebar: Projects */
        sidebar {
            width: 240px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
            width: 100%;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .project-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .project-item {
            padding: 10px;
            background-color: var(--bg-card);
            border-radius: 6px;
            margin-bottom: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .project-item:hover, .project-item.active {
            border-color: var(--accent);
        }

        /* Center Content Area */
        .center-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
            overflow: hidden;
        }

        /* Top Section: Master Timeline & Playback */
        .timeline-section {
            flex: 1;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            padding: 15px;
            min-height: 120px;
        }

        .timeline-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .timeline-toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .control-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .control-btn:hover {
            border-color: var(--accent);
        }

        .setting-control {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            background-color: var(--bg-card);
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .setting-control select {
            background-color: var(--bg-panel);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 6px;
            cursor: pointer;
        }

        .setting-control input[type="range"] {
            accent-color: var(--accent);
            cursor: pointer;
        }

        .master-grid {
            flex: 1;
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .master-track-row {
            display: flex;
            align-items: center;
            font-size: 0.8rem;
            background-color: var(--bg-card);
            padding: 6px 10px;
            border-radius: 4px;
            justify-content: space-between;
        }

        /* Resize Handle Bar */
        .resize-handle {
            height: 8px;
            background-color: var(--border);
            cursor: ns-resize;
            width: 100%;
            transition: background 0.2s;
        }

        .resize-handle:hover {
            background-color: var(--accent);
        }

        /* Bottom Section: Instrument Drawer / Sub-Page */
        .instrument-workspace {
            height: 300px;
            min-height: 100px;
            max-height: 600px;
            background-color: var(--bg-panel);
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow: hidden;
        }

        .instrument-search {
            width: 100%;
            padding: 8px 12px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .instrument-search:focus {
            outline: none;
            border-color: var(--accent);
        }

        .instrument-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
            overflow-y: auto;
            flex: 1;
        }

        .instrument-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.2s;
            height: 90px;
            justify-content: center;
        }

        .instrument-card:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        /* Sequencer Sub-Page View */
        .sequencer-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
        }

        .sequencer-grid-container {
            flex: 1;
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: auto;
            padding: 10px;
        }

        .sequencer-row {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }

        .note-label {
            width: 90px;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            flex-shrink: 0;
        }

        .steps-container {
            display: flex;
            gap: 4px;
            flex: 1;
        }

        .step-box {
            width: 32px;
            height: 32px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            color: rgba(255,255,255,0.7);
        }

        .step-box:hover {
            border-color: var(--accent);
        }

        .step-box.active-1 {
            background-color: var(--active-note);
            border-color: var(--active-note);
            color: white;
        }

        .step-box.active-2 {
            background-color: #059669;
            border-color: #047857;
            width: calc(68px); /* 32 * 2 + gap 4 */
            color: white;
            font-weight: bold;
        }

        .step-box.active-4 {
            background-color: #047857;
            border-color: #065f46;
            width: calc(140px); /* 32 * 4 + gaps */
            color: white;
            font-weight: bold;
        }

        .step-box.playing-head {
            border-color: white !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎵 Open Music Lab</h1>
        <span id="current-project-label" style="color: var(--text-muted); font-size: 0.85rem;">Project: Untitled</span>
    </header>

    <div class="workspace-container">
        <!-- Sidebar: Projects -->
        <sidebar>
            <div class="section-title">Projects</div>
            <button class="btn" onclick="createNewProject()">+ New Project</button>
            <ul id="project-list" class="project-list"></ul>
        </sidebar>

        <!-- Center Workspace -->
        <div class="center-workspace">
            <!-- Top: Master Timeline & Playback -->
            <div class="timeline-section">
                <div class="timeline-header">
                    <div class="section-title" style="margin: 0;">Master Timeline & Controls</div>
                    <div class="timeline-toolbar">
                        <div class="setting-control">
                            <span>Length:</span>
                            <select id="length-select" onchange="updateTrackLength(this.value)">
                                <option value="16">16 Steps</option>
                                <option value="32" selected>32 Steps</option>
                                <option value="64">64 Steps</option>
                            </select>
                        </div>
                        <div class="setting-control">
                            <span>Tempo: <strong id="bpm-display" style="color:var(--text-main);">120</strong> BPM</span>
                            <input type="range" id="bpm-slider" min="60" max="180" value="120" oninput="updateTempo(this.value)">
                        </div>
                        <button class="control-btn" id="play-btn" onclick="togglePlayback()">▶ Play Composition</button>
                    </div>
                </div>
                <div class="master-grid" id="master-grid">
                    <div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 20px;">No notes added yet. Select an instrument below to start placing notes! (Click a note box to place, click again to extend duration).</div>
                </div>
            </div>

            <!-- Resizable Divider Handle -->
            <div class="resize-handle" id="resize-handle" title="Drag to resize panels"></div>

            <!-- Bottom: Instrument Hub / Sub-Page Workspace -->
            <div class="instrument-workspace" id="bottom-workspace">
                <!-- Dynamically swapped between Instrument List and Sequencer Sub-Page -->
            </div>
        </div>
    </div>

    <script>
        // Web Audio API Context Setup
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(instrumentName, noteName, durationSteps = 1, bpm = 120) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            let freq = 440;
            if (noteName.includes('C5')) freq = 523.25;
            else if (noteName.includes('B4')) freq = 493.88;
            else if (noteName.includes('A4')) freq = 440.00;
            else if (noteName.includes('G4')) freq = 392.00;
            else if (noteName.includes('F4')) freq = 349.23;
            else if (noteName.includes('E4')) freq = 329.63;
            else if (noteName.includes('D4')) freq = 293.66;
            else if (noteName.includes('C4')) freq = 261.63;
            else if (noteName.includes('High')) freq = 1400;
            else if (noteName.includes('Mid')) freq = 900;
            else if (noteName.includes('Low')) freq = 400;
            else if (noteName.includes('Tap')) freq = 300;

            if (instrumentName.includes('Jingle')) {
                osc.type = 'triangle';
            } else if (instrumentName.includes('Stick') || instrumentName.includes('Woodblock')) {
                osc.type = 'square';
            } else {
                osc.type = 'sine';
            }

            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            // Calculate duration in seconds based on BPM and steps
            const stepDurationSec = (15 / bpm) * durationSteps;

            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + Math.max(0.2, stepDurationSec));

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + Math.max(0.2, stepDurationSec));
        }

        // Resizing Handle
        const resizeHandle = document.getElementById('resize-handle');
        const bottomWorkspace = document.getElementById('bottom-workspace');
        let isResizing = false;

        resizeHandle.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.style.cursor = 'ns-resize';
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const containerRect = document.querySelector('.center-workspace').getBoundingClientRect();
            const newHeight = containerRect.bottom - e.clientY;
            if (newHeight >= 100 && newHeight <= containerRect.height - 100) {
                bottomWorkspace.style.height = `${newHeight}px`;
            }
        });

        window.addEventListener('mouseup', () => {
            isResizing = false;
            document.body.style.cursor = 'default';
        });

        // State Management
        let projects = JSON.parse(localStorage.getItem('music_lab_projects')) || [
            { id: 1, name: 'My First Beat', patterns: {}, totalSteps: 32 }
        ];
        let currentProjectId = projects[0].id;
        let activeInstrument = null;
        
        let currentBpm = 120;
        let isPlaying = false;
        let currentStep = 0;
        let playbackTimer = null;

        const instruments = [
            { name: 'Acoustic Grand Piano', category: 'Keys', notes: ['C5', 'B4', 'A4', 'G4', 'F4', 'E4', 'D4', 'C4'] },
            { name: 'Jingle Bell', category: 'Percussion', notes: ['High Jingles', 'Mid Jingles', 'Low Jingles', 'Single Tap'] },
            { name: 'Stick Tap / Woodblock', category: 'Percussion', notes: ['High Wood', 'Mid Wood', 'Low Wood', 'Rim Tap'] },
            { name: 'Acoustic Guitar', category: 'Strings', notes: ['G4', 'F4', 'E4', 'D4', 'C4', 'B3', 'A3'] },
            { name: 'Flute', category: 'Woodwind', notes: ['C5', 'B4', 'A4', 'G4', 'F4', 'E4', 'D4', 'C4'] },
            { name: 'Synth Lead', category: 'Electronic', notes: ['C5', 'B4', 'A4', 'G4', 'F4', 'E4', 'D4', 'C4'] }
        ];

        function init() {
            renderProjects();
            syncLengthSelect();
            renderBottomWorkspace();
            renderMasterTimeline();
        }

        function getActiveProject() {
            return projects.find(p => p.id === currentProjectId);
        }

        function syncLengthSelect() {
            const activeProj = getActiveProject();
            if (activeProj) {
                document.getElementById('length-select').value = activeProj.totalSteps || 32;
            }
        }

        function updateTrackLength(newSteps) {
            const activeProj = getActiveProject();
            if (!activeProj) return;
            activeProj.totalSteps = parseInt(newSteps);
            
            Object.keys(activeProj.patterns).forEach(instName => {
                Object.keys(activeProj.patterns[instName]).forEach(noteName => {
                    const arr = activeProj.patterns[instName][noteName];
                    if (arr.length < activeProj.totalSteps) {
                        while (arr.length < activeProj.totalSteps) arr.push(0);
                    } else if (arr.length > activeProj.totalSteps) {
                        activeProj.patterns[instName][noteName] = arr.slice(0, activeProj.totalSteps);
                    }
                });
            });

            saveAndRefresh();
            if (activeInstrument) {
                const inst = instruments.find(i => i.name === activeInstrument);
                if (inst) populateSequencerGrid(inst);
            }
        }

        function renderProjects() {
            const list = document.getElementById('project-list');
            list.innerHTML = '';
            projects.forEach(p => {
                const li = document.createElement('li');
                li.className = `project-item ${p.id === currentProjectId ? 'active' : ''}`;
                li.innerHTML = `<strong>${p.name}</strong>`;
                li.onclick = () => { switchProject(p.id); };
                list.appendChild(li);
            });
            const activeProj = getActiveProject();
            document.getElementById('current-project-label').innerText = `Project: ${activeProj ? activeProj.name : 'Untitled'}`;
        }

        function createNewProject() {
            const name = prompt("Enter project name:", `Project ${projects.length + 1}`);
            if (!name) return;
            const newProj = { id: Date.now(), name: name, patterns: {}, totalSteps: 32 };
            projects.push(newProj);
            saveAndRefresh();
            switchProject(newProj.id);
        }

        function switchProject(id) {
            if (isPlaying) stopPlayback();
            currentProjectId = id;
            activeInstrument = null;
            renderProjects();
            syncLengthSelect();
            renderBottomWorkspace();
            renderMasterTimeline();
        }

        function saveAndRefresh() {
            localStorage.setItem('music_lab_projects', JSON.stringify(projects));
            renderProjects();
        }

        function renderBottomWorkspace() {
            const ws = document.getElementById('bottom-workspace');
            
            if (!activeInstrument) {
                ws.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
                        <span class="section-title" style="margin: 0;">Instrument Hub (Click an instrument to open its note grid)</span>
                    </div>
                    <input type="text" class="instrument-search" placeholder="Search instruments..." oninput="filterInstruments(this.value)">
                    <div class="instrument-grid" id="instrument-grid"></div>
                `;
                populateInstrumentGrid(instruments);
            } else {
                const inst = instruments.find(i => i.name === activeInstrument);
                ws.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
                        <button class="control-btn" onclick="activeInstrument = null; renderBottomWorkspace();">← Back to Instrument Hub</button>
                        <strong style="font-size: 0.95rem; color: var(--accent);">${inst.name} Notes (Click to set/extend duration)</strong>
                        <span style="font-size: 0.75rem; color: var(--text-muted);">${inst.category}</span>
                    </div>
                    <div class="sequencer-view">
                        <div class="sequencer-grid-container" id="sequencer-grid"></div>
                    </div>
                `;
                populateSequencerGrid(inst);
            }
        }

        function populateInstrumentGrid(items) {
            const grid = document.getElementById('instrument-grid');
            if (!grid) return;
            grid.innerHTML = '';
            items.forEach(inst => {
                const card = document.createElement('div');
                card.className = 'instrument-card';
                card.innerHTML = `
                    <strong style="font-size:0.9rem;">${inst.name}</strong>
                    <span style="font-size:0.75rem; color:var(--text-muted);">${inst.category} • ${inst.notes.length} pitches</span>
                `;
                card.onclick = () => {
                    activeInstrument = inst.name;
                    renderBottomWorkspace();
                };
                grid.appendChild(card);
            });
        }

        function filterInstruments(query) {
            const filtered = instruments.filter(i => i.name.toLowerCase().includes(query.toLowerCase()) || i.category.toLowerCase().includes(query.toLowerCase()));
            populateInstrumentGrid(filtered);
        }

        function populateSequencerGrid(inst) {
            const container = document.getElementById('sequencer-grid');
            if (!container) return;
            container.innerHTML = '';

            const activeProj = getActiveProject();
            const totalSteps = activeProj.totalSteps || 32;

            if (!activeProj.patterns[inst.name]) {
                activeProj.patterns[inst.name] = {};
                inst.notes.forEach(note => {
                    activeProj.patterns[inst.name][note] = new Array(totalSteps).fill(0);
                });
            }

            inst.notes.forEach(note => {
                const row = document.createElement('div');
                row.className = 'sequencer-row';

                const label = document.createElement('div');
                label.className = 'note-label';
                label.innerText = note;
                row.appendChild(label);

                const stepsDiv = document.createElement('div');
                stepsDiv.className = 'steps-container';

                if (!activeProj.patterns[inst.name][note]) {
                    activeProj.patterns[inst.name][note] = new Array(totalSteps).fill(0);
                }

                const patternArr = activeProj.patterns[inst.name][note];

                for (let s = 0; s < totalSteps; s++) {
                    const duration = patternArr[s];
                    const stepBox = document.createElement('div');
                    
                    if (duration > 0) {
                        stepBox.className = `step-box active-${duration}`;
                        stepBox.innerText = `${duration}x`;
                    } else {
                        stepBox.className = 'step-box';
                    }

                    if (isPlaying && currentStep === s) {
                        stepBox.classList.add('playing-head');
                    }

                    stepBox.onclick = () => {
                        // Cycle duration: 0 -> 1 -> 2 -> 4 -> 0
                        let nextDuration = 0;
                        if (duration === 0) nextDuration = 1;
                        else if (duration === 1) nextDuration = 2;
                        else if (duration === 2) nextDuration = 4;
                        else nextDuration = 0;

                        // Clear any overlapping spans if extending
                        patternArr[s] = nextDuration;
                        
                        saveAndRefresh();
                        populateSequencerGrid(inst);
                        renderMasterTimeline();

                        if (nextDuration > 0) {
                            playTone(inst.name, note, nextDuration, currentBpm);
                        }
                    };

                    stepsDiv.appendChild(stepBox);
                }

                row.appendChild(stepsDiv);
                container.appendChild(row);
            });
        }

        function renderMasterTimeline() {
            const grid = document.getElementById('master-grid');
            const activeProj = getActiveProject();
            grid.innerHTML = '';

            const activeInstruments = Object.keys(activeProj.patterns).filter(instName => {
                const notesObj = activeProj.patterns[instName];
                return Object.values(notesObj).some(arr => arr.some(val => val > 0));
            });

            if (activeInstruments.length === 0) {
                grid.innerHTML = `<div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 20px;">No notes added yet. Select an instrument below to start placing notes!</div>`;
                return;
            }

            activeInstruments.forEach(instName => {
                const row = document.createElement('div');
                row.className = 'master-track-row';
                row.innerHTML = `<strong>${instName}</strong> <span style="color: var(--active-note);">Active pattern assigned</span>`;
                grid.appendChild(row);
            });
        }

        function updateTempo(val) {
            currentBpm = parseInt(val);
            document.getElementById('bpm-display').innerText = currentBpm;
            if (isPlaying) {
                clearInterval(playbackTimer);
                startPlaybackTimer();
            }
        }

        function togglePlayback() {
            initAudio();
            if (isPlaying) {
                stopPlayback();
            } else {
                startPlayback();
            }
        }

        function startPlayback() {
            isPlaying = true;
            document.getElementById('play-btn').innerText = '⏹ Stop Composition';
            currentStep = 0;
            startPlaybackTimer();
        }

        function startPlaybackTimer() {
            const activeProj = getActiveProject();
            const totalSteps = activeProj ? (activeProj.totalSteps || 32) : 32;
            const intervalMs = 15000 / currentBpm;

            playbackTimer = setInterval(() => {
                playCurrentStep();
                currentStep = (currentStep + 1) % totalSteps;
                if (activeInstrument) {
                    const inst = instruments.find(i => i.name === activeInstrument);
                    if (inst) populateSequencerGrid(inst);
                }
            }, intervalMs);
        }

        function stopPlayback() {
            isPlaying = false;
            clearInterval(playbackTimer);
            document.getElementById('play-btn').innerText = '▶ Play Composition';
            currentStep = 0;
            if (activeInstrument) {
                const inst = instruments.find(i => i.name === activeInstrument);
                if (inst) populateSequencerGrid(inst);
            }
        }

        function playCurrentStep() {
            const activeProj = getActiveProject();
            if (!activeProj || !activeProj.patterns) return;

            Object.keys(activeProj.patterns).forEach(instName => {
                const notesObj = activeProj.patterns[instName];
                Object.keys(notesObj).forEach(noteName => {
                    const duration = notesObj[noteName][currentStep];
                    if (duration > 0) {
                        playTone(instName, noteName, duration, currentBpm);
                    }
                });
            });
        }

        init();
    </script>
</body>
</html>
