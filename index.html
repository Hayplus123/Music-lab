<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Music Lab - Sequencer & Instruments</title>
    <style>
        :root {
            --bg-dark: #121214;
            --bg-panel: #1a1a1e;
            --bg-card: #24242c;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2e2e38;
            --active-note: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        header {
            height: 45px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        header h1 {
            font-size: 1rem;
            font-weight: 600;
        }

        /* Workspace Layout */
        .workspace-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Left Sidebar: Projects */
        sidebar {
            width: 240px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
            width: 100%;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .project-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .project-item {
            padding: 10px;
            background-color: var(--bg-card);
            border-radius: 6px;
            margin-bottom: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .project-item:hover, .project-item.active {
            border-color: var(--accent);
        }

        /* Center Content Area */
        .center-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
            overflow: hidden;
        }

        /* Top Section: Master Timeline & Playback */
        .timeline-section {
            height: 200px;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        .timeline-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .timeline-toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .control-btn:hover {
            border-color: var(--accent);
        }

        .master-grid {
            flex: 1;
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .master-track-row {
            display: flex;
            align-items: center;
            font-size: 0.8rem;
            background-color: var(--bg-card);
            padding: 6px 10px;
            border-radius: 4px;
        }

        /* Bottom Section: Instrument Drawer / Sub-Page */
        .instrument-workspace {
            flex: 1;
            background-color: var(--bg-panel);
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow: hidden;
        }

        .instrument-search {
            width: 100%;
            padding: 8px 12px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .instrument-search:focus {
            outline: none;
            border-color: var(--accent);
        }

        .instrument-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
            overflow-y: auto;
            flex: 1;
        }

        .instrument-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.2s;
            height: 90px;
            justify-content: center;
        }

        .instrument-card:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        /* Sequencer Sub-Page View */
        .sequencer-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
        }

        .sequencer-grid-container {
            flex: 1;
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: auto;
            padding: 10px;
        }

        .sequencer-row {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }

        .note-label {
            width: 70px;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .steps-container {
            display: flex;
            gap: 4px;
            flex: 1;
        }

        .step-box {
            width: 32px;
            height: 32px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.1s;
        }

        .step-box:hover {
            border-color: var(--accent);
        }

        .step-box.active {
            background-color: var(--active-note);
            border-color: var(--active-note);
        }

        .step-box.playing-head {
            border-color: white !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎵 Open Music Lab</h1>
        <span id="current-project-label" style="color: var(--text-muted); font-size: 0.85rem;">Project: Untitled</span>
    </header>

    <div class="workspace-container">
        <!-- Sidebar: Projects -->
        <sidebar>
            <div class="section-title">Projects</div>
            <button class="btn" onclick="createNewProject()">+ New Project</button>
            <ul id="project-list" class="project-list"></ul>
        </sidebar>

        <!-- Center Workspace -->
        <div class="center-workspace">
            <!-- Top: Master Timeline & Playback -->
            <div class="timeline-section">
                <div class="timeline-header">
                    <div class="section-title" style="margin: 0;">Master Timeline (All Layered Instruments)</div>
                    <div class="timeline-toolbar">
                        <button class="control-btn" id="play-btn" onclick="togglePlayback()">▶ Play Full Composition</button>
                    </div>
                </div>
                <div class="master-grid" id="master-grid">
                    <div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 20px;">No notes added yet. Select an instrument below to start placing notes!</div>
                </div>
            </div>

            <!-- Bottom: Instrument Hub / Sub-Page Workspace -->
            <div class="instrument-workspace" id="bottom-workspace">
                <!-- Dynamically swapped between Instrument List and Sequencer Sub-Page -->
            </div>
        </div>
    </div>

    <script>
        // Web Audio API Context Setup
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(instrumentName, noteName) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            let freq = 440;
            if (noteName === 'C4') freq = 261.63;
            if (noteName === 'E4') freq = 329.63;
            if (noteName === 'G4') freq = 392.00;
            if (noteName === 'C5') freq = 523.25;
            if (noteName === 'High' || noteName === 'Tap') freq = 1200;
            if (noteName === 'Low') freq = 180;

            if (instrumentName.includes('Jingle')) {
                osc.type = 'triangle';
            } else if (instrumentName.includes('Stick')) {
                osc.type = 'square';
            } else {
                osc.type = 'sine';
            }

            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // State Management
        let projects = JSON.parse(localStorage.getItem('music_lab_projects')) || [
            { id: 1, name: 'My First Beat', patterns: {} } // patterns[instrumentName] = { noteName: [true, false, ...] }
        ];
        let currentProjectId = projects[0].id;
        let activeInstrument = null; // null = Instrument Hub, string = Instrument Sequencer Page
        
        const TOTAL_STEPS = 16;
        let isPlaying = false;
        let currentStep = 0;
        let playbackTimer = null;

        const instruments = [
            { name: 'Acoustic Grand Piano', category: 'Keys', notes: ['C5', 'G4', 'E4', 'C4'] },
            { name: 'Jingle Bell', category: 'Percussion', notes: ['High', 'Low'] },
            { name: 'Stick Tap / Woodblock', category: 'Percussion', notes: ['Tap'] },
            { name: 'Acoustic Guitar', category: 'Strings', notes: ['G4', 'E4', 'C4'] },
            { name: 'Flute', category: 'Woodwind', notes: ['C5', 'G4', 'C4'] },
            { name: 'Synth Lead', category: 'Electronic', notes: ['C5', 'G4', 'E4', 'C4'] }
        ];

        function init() {
            renderProjects();
            renderBottomWorkspace();
            renderMasterTimeline();
        }

        function renderProjects() {
            const list = document.getElementById('project-list');
            list.innerHTML = '';
            projects.forEach(p => {
                const li = document.createElement('li');
                li.className = `project-item ${p.id === currentProjectId ? 'active' : ''}`;
                li.innerHTML = `<strong>${p.name}</strong>`;
                li.onclick = () => { switchProject(p.id); };
                list.appendChild(li);
            });
            const activeProj = projects.find(p => p.id === currentProjectId);
            document.getElementById('current-project-label').innerText = `Project: ${activeProj ? activeProj.name : 'Untitled'}`;
        }

        function createNewProject() {
            const name = prompt("Enter project name:", `Project ${projects.length + 1}`);
            if (!name) return;
            const newProj = { id: Date.now(), name: name, patterns: {} };
            projects.push(newProj);
            saveAndRefresh();
            switchProject(newProj.id);
        }

        function switchProject(id) {
            if (isPlaying) stopPlayback();
            currentProjectId = id;
            activeInstrument = null;
            renderProjects();
            renderBottomWorkspace();
            renderMasterTimeline();
        }

        function saveAndRefresh() {
            localStorage.setItem('music_lab_projects', JSON.stringify(projects));
            renderProjects();
        }

        function renderBottomWorkspace() {
            const ws = document.getElementById('bottom-workspace');
            
            if (!activeInstrument) {
                // View 1: Instrument Hub List
                ws.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
                        <span class="section-title" style="margin: 0;">Instrument Hub (Click an instrument to open its page)</span>
                    </div>
                    <input type="text" class="instrument-search" placeholder="Search instruments..." oninput="filterInstruments(this.value)">
                    <div class="instrument-grid" id="instrument-grid"></div>
                `;
                populateInstrumentGrid(instruments);
            } else {
                // View 2: Instrument Sequencer Sub-Page
                const inst = instruments.find(i => i.name === activeInstrument);
                ws.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
                        <button class="control-btn" onclick="activeInstrument = null; renderBottomWorkspace();">← Back to Instrument Hub</button>
                        <strong style="font-size: 0.95rem; color: var(--accent);">${inst.name} Sequencer</strong>
                        <span style="font-size: 0.75rem; color: var(--text-muted);">${inst.category}</span>
                    </div>
                    <div class="sequencer-view">
                        <div class="sequencer-grid-container" id="sequencer-grid"></div>
                    </div>
                `;
                populateSequencerGrid(inst);
            }
        }

        function populateInstrumentGrid(items) {
            const grid = document.getElementById('instrument-grid');
            if (!grid) return;
            grid.innerHTML = '';
            items.forEach(inst => {
                const card = document.createElement('div');
                card.className = 'instrument-card';
                card.innerHTML = `
                    <strong style="font-size:0.9rem;">${inst.name}</strong>
                    <span style="font-size:0.75rem; color:var(--text-muted);">${inst.category} • Click to open notes</span>
                `;
                card.onclick = () => {
                    activeInstrument = inst.name;
                    renderBottomWorkspace();
                };
                grid.appendChild(card);
            });
        }

        function filterInstruments(query) {
            const filtered = instruments.filter(i => i.name.toLowerCase().includes(query.toLowerCase()) || i.category.toLowerCase().includes(query.toLowerCase()));
            populateInstrumentGrid(filtered);
        }

        function populateSequencerGrid(inst) {
            const container = document.getElementById('sequencer-grid');
            if (!container) return;
            container.innerHTML = '';

            const activeProj = projects.find(p => p.id === currentProjectId);
            if (!activeProj.patterns[inst.name]) {
                activeProj.patterns[inst.name] = {};
                inst.notes.forEach(note => {
                    activeProj.patterns[inst.name][note] = new Array(TOTAL_STEPS).fill(false);
                });
            }

            inst.notes.forEach(note => {
                const row = document.createElement('div');
                row.className = 'sequencer-row';

                const label = document.createElement('div');
                label.className = 'note-label';
                label.innerText = note;
                row.appendChild(label);

                const stepsDiv = document.createElement('div');
                stepsDiv.className = 'steps-container';

                for (let s = 0; s < TOTAL_STEPS; s++) {
                    const stepBox = document.createElement('div');
                    stepBox.className = 'step-box';
                    if (activeProj.patterns[inst.name][note][s]) {
                        stepBox.classList.add('active');
                    }
                    if (isPlaying && currentStep === s) {
                        stepBox.classList.add('playing-head');
                    }

                    stepBox.onclick = () => {
                        activeProj.patterns[inst.name][note][s] = !activeProj.patterns[inst.name][note][s];
                        saveAndRefresh();
                        populateSequencerGrid(inst);
                        renderMasterTimeline();
                        if (activeProj.patterns[inst.name][note][s]) {
                            playTone(inst.name, note);
                        }
                    };

                    stepsDiv.appendChild(stepBox);
                }

                row.appendChild(stepsDiv);
                container.appendChild(row);
            });
        }

        function renderMasterTimeline() {
            const grid = document.getElementById('master-grid');
            const activeProj = projects.find(p => p.id === currentProjectId);
            grid.innerHTML = '';

            const activeInstruments = Object.keys(activeProj.patterns).filter(instName => {
                const notesObj = activeProj.patterns[instName];
                return Object.values(notesObj).some(arr => arr.some(val => val === true));
            });

            if (activeInstruments.length === 0) {
                grid.innerHTML = `<div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 20px;">No notes added yet. Select an instrument below to start placing notes!</div>`;
                return;
            }

            activeInstruments.forEach(instName => {
                const row = document.createElement('div');
                row.className = 'master-track-row';
                row.innerHTML = `<strong>${instName}</strong> <span style="margin-left: 10px; color: var(--accent);">Active melody pattern saved</span>`;
                grid.appendChild(row);
            });
        }

        function togglePlayback() {
            initAudio();
            if (isPlaying) {
                stopPlayback();
            } else {
                startPlayback();
            }
        }

        function startPlayback() {
            isPlaying = true;
            document.getElementById('play-btn').innerText = '⏹ Stop Composition';
            currentStep = 0;

            playbackTimer = setInterval(() => {
                playCurrentStep();
                currentStep = (currentStep + 1) % TOTAL_STEPS;
                if (activeInstrument) {
                    const inst = instruments.find(i => i.name === activeInstrument);
                    if (inst) populateSequencerGrid(inst);
                }
            }, 250); // 16th note speed
        }

        function stopPlayback() {
            isPlaying = false;
            clearInterval(playbackTimer);
            document.getElementById('play-btn').innerText = '▶ Play Full Composition';
            currentStep = 0;
            if (activeInstrument) {
                const inst = instruments.find(i => i.name === activeInstrument);
                if (inst) populateSequencerGrid(inst);
            }
        }

        function playCurrentStep() {
            const activeProj = projects.find(p => p.id === currentProjectId);
            if (!activeProj || !activeProj.patterns) return;

            Object.keys(activeProj.patterns).forEach(instName => {
                const notesObj = activeProj.patterns[instName];
                Object.keys(notesObj).forEach(noteName => {
                    if (notesObj[noteName][currentStep]) {
                        playTone(instName, noteName);
                    }
                });
            });
        }

        init();
    </script>
</body>
</html>
